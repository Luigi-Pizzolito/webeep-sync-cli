name: ci

on:
  # Nothing runs on an ordinary commit. This is a private repository and macOS
  # minutes bill at 10x, so the suite runs when you ask for it:
  #
  #   gh workflow run ci.yml              # the default branch
  #   gh workflow run ci.yml --ref <sha>  # a specific commit
  #
  # It also runs as the gate at the front of release.yml on every version tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: vet and format
        run: |
          go vet ./...
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt clean:"; echo "$unformatted"; exit 1
          fi

      - name: test
        run: go test -race ./...

      # The release ships Windows and macOS binaries, but only Linux and macOS
      # run the suite, so keep the other targets compiling.
      - name: cross-compile check
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
