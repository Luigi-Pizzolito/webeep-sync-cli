name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: vet and format
        run: |
          go vet ./...
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt clean:"; echo "$unformatted"; exit 1
          fi

      - name: test
        run: go test -race ./...

  arch-package:
    name: Arch package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the package with makepkg inside Arch Linux
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work/packaging/arch \
            archlinux/archlinux:latest \
            bash -euo pipefail -c '
              # The base Arch image has no git, and it runs as root while makepkg
              # refuses to build as root. So: install what is needed as root, hand
              # the checkout to an unprivileged user, build as that user.
              pacman -Syu --noconfirm --needed go git base-devel
              useradd -m builduser
              chown -R builduser:builduser /work
              su builduser -c "cd /work/packaging/arch && makepkg --noconfirm"
              chmod -R a+rwX /work
            '

      - name: Checksums
        run: |
          cd packaging/arch
          sha256sum ./*.pkg.tar.zst
          ls -lh ./*.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  binaries:
    name: binary (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          set -euo pipefail
          os="${{ matrix.goos }}"
          arch="${{ matrix.goarch }}"
          name="webeep-sync-cli-$os-$arch"
          bin=webeep-sync-cli
          ext=tar.gz
          if [ "$os" = windows ]; then bin=webeep-sync-cli.exe; ext=zip; fi
          mkdir -p "dist/$name"
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
            go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "dist/$name/$bin" .
          cp LICENSE README.md "dist/$name/"
          # Only the build that matches the runner can actually be executed here.
          if [ "$os" = linux ] && [ "$arch" = amd64 ]; then
            "dist/$name/$bin" version
          fi
          if [ "$ext" = zip ]; then
            (cd dist && zip -qr "$name.zip" "$name")
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [test, arch-package, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
          files=(*)
          # --repo is required: this job has no checkout, so gh has no git
          # context to work out which repository the release belongs to.
          if gh release view --repo "$repo" "$tag" >/dev/null 2>&1; then
            gh release upload --clobber --repo "$repo" "$tag" "${files[@]}"
          else
            gh release create --repo "$repo" "$tag" "${files[@]}" \
              --verify-tag --title "$tag" \
              --notes 'Builds of webeep-sync-cli. On Arch, install the package with sudo pacman -U ./webeep-sync-cli-<version>-x86_64.pkg.tar.zst on an up to date install. The Linux and macOS tarballs and the Windows zips hold plain static binaries with the license and this README; the macOS builds are not code signed, so on first run clear the quarantine attribute with xattr -d com.apple.quarantine. Windows builds compile and vet clean but are not run-tested yet.'
          fi
